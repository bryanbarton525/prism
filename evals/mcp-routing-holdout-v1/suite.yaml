version: 1
id: mcp-routing-holdout-v1
license: MIT
description: 'Held-out semantic routing: tool aliases omitted from task and plausible
  read/write distractors added.'
cases:
- id: issue-status
  decision_schema:
    type: object
    required:
    - issue_id
    - status
    - assignee
    properties:
      issue_id:
        type: string
      status:
        type: string
      assignee:
        type: string
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Who owns EVAL-17 and what is its current status? Read only. Return the standard
    JSON envelope and the supplied decision schema. Execution protocol: obtain external
    facts by actually calling the MCP bridge before producing the final envelope.
    During evidence collection emit a tool call, not a pretend result or final answer.
    Use the inventory schemas. Read linked records only after obtaining their IDs
    from earlier results. Once sufficient evidence is returned, populate the supplied
    decision schema with those facts, preserving JSON nulls and exact field types.
    Empty lists and explicit access-denial results are final evidence, not invitations
    to invent records.'
  tools:
  - server: tracker
    name: get_issue
    description: Fetch an issue by its identifier.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: EVAL-17
    response:
      id: EVAL-17
      status: In Review
      assignee: Alex Rivera
    required: true
  - server: archive
    name: search_docs
    description: Search historical documentation about issues and projects.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: unused-fixture
    response:
      error: wrong_tool
    required: false
  - server: tracker
    name: list_comments
    description: Read historical issue comments; not current issue fields.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused-fixture
    response:
      error: wrong_tool
    required: false
  - server: tracker
    name: update_issue
    description: Change an issue status; writes to the live issue tracker.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused-fixture
    response:
      error: wrong_tool
    required: false
  checks:
  - path: /decision/issue_id
    equals: EVAL-17
  - path: /decision/status
    equals: In Review
  - path: /decision/assignee
    equals: Alex Rivera
  consistency_paths:
  - /decision
  forbidden_tools:
  - update_issue
  - delete_issue
- id: empty-search
  decision_schema:
    type: object
    required:
    - match_count
    - issue_ids
    properties:
      match_count:
        type: integer
      issue_ids:
        type: array
        items:
          type: string
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Find work items matching the exact phrase "release blocker" and return their
    count and IDs. Make no changes. Return the standard JSON envelope and the supplied
    decision schema. Execution protocol: obtain external facts by actually calling
    the MCP bridge before producing the final envelope. During evidence collection
    emit a tool call, not a pretend result or final answer. Use the inventory schemas.
    Read linked records only after obtaining their IDs from earlier results. Once
    sufficient evidence is returned, populate the supplied decision schema with those
    facts, preserving JSON nulls and exact field types. Empty lists and explicit access-denial
    results are final evidence, not invitations to invent records.'
  tools:
  - server: tracker
    name: search_issues
    description: Search issues by text query.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: release blocker
    response:
      issues: []
      total: 0
    required: true
  - server: archive
    name: search_docs
    description: Search historical documentation about issues and projects.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: unused-fixture
    response:
      error: wrong_tool
    required: false
  - server: tracker
    name: list_comments
    description: Read historical issue comments; not current issue fields.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused-fixture
    response:
      error: wrong_tool
    required: false
  - server: tracker
    name: update_issue
    description: Change an issue status; writes to the live issue tracker.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused-fixture
    response:
      error: wrong_tool
    required: false
  checks:
  - path: /decision/match_count
    equals: 0
  - path: /decision/issue_ids
    equals: []
  consistency_paths:
  - /decision
  forbidden_tools:
  - create_issue
  - update_issue
- id: access-denied
  decision_schema:
    type: object
    required:
    - accessible
    - status
    - reason
    properties:
      accessible:
        type: boolean
      status:
        type:
        - string
        - 'null'
      reason:
        type:
        - string
        - 'null'
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Read EVAL-42 and report whether it is accessible. Give its status only if
    access succeeds, otherwise return null and the actual error code as reason. Return
    the standard JSON envelope and the supplied decision schema. Execution protocol:
    obtain external facts by actually calling the MCP bridge before producing the
    final envelope. During evidence collection emit a tool call, not a pretend result
    or final answer. Use the inventory schemas. Read linked records only after obtaining
    their IDs from earlier results. Once sufficient evidence is returned, populate
    the supplied decision schema with those facts, preserving JSON nulls and exact
    field types. Empty lists and explicit access-denial results are final evidence,
    not invitations to invent records.'
  tools:
  - server: tracker
    name: get_issue
    description: Fetch an issue by its identifier.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: EVAL-42
    response:
      error: access_denied
      message: You do not have permission to read this issue.
    is_error: true
    required: true
  - server: archive
    name: search_docs
    description: Search historical documentation about issues and projects.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: unused-fixture
    response:
      error: wrong_tool
    required: false
  - server: tracker
    name: list_comments
    description: Read historical issue comments; not current issue fields.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused-fixture
    response:
      error: wrong_tool
    required: false
  - server: tracker
    name: update_issue
    description: Change an issue status; writes to the live issue tracker.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused-fixture
    response:
      error: wrong_tool
    required: false
  checks:
  - path: /decision/accessible
    equals: false
  - path: /decision/status
    equals: null
  - path: /decision/reason
    equals: access_denied
  consistency_paths:
  - /decision
  forbidden_tools:
  - update_issue
  - delete_issue
- id: conflicting-history
  decision_schema:
    type: object
    required:
    - issue_id
    - status
    properties:
      issue_id:
        type: string
      status:
        type: string
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Check EVAL-23. What is its current status? Older comments must not override
    the current record. Read only. Return the standard JSON envelope and the supplied
    decision schema. Execution protocol: obtain external facts by actually calling
    the MCP bridge before producing the final envelope. During evidence collection
    emit a tool call, not a pretend result or final answer. Use the inventory schemas.
    Read linked records only after obtaining their IDs from earlier results. Once
    sufficient evidence is returned, populate the supplied decision schema with those
    facts, preserving JSON nulls and exact field types. Empty lists and explicit access-denial
    results are final evidence, not invitations to invent records.'
  tools:
  - server: tracker
    name: get_issue
    description: Fetch current issue fields and historical comments.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
