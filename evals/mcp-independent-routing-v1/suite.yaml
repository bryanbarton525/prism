    current records rather than unrelated historical searches. Copy record field values
    as returned and preserve search-result order.'
  decision_schema:
    type: object
    required:
    - match_count
    - issue_ids
    properties:
      match_count:
        type: integer
      issue_ids:
        type: array
        items:
          type: string
  tools:
  - server: work
    name: search_issues
    description: Search current issues by text query.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: storage quota
    response:
      issues:
      - id: OPS-404
      - id: OPS-405
      total: 2
    required: true
  - server: archive
    name: search_docs
    description: Search historical documents, not current issue or project records.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: unused
    response:
      error: irrelevant_tool
    required: false
  - server: tracker
    name: list_comments
    description: List old issue discussion comments, not current fields.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused
    response:
      error: irrelevant_tool
    required: false
  - server: tracker
    name: update_issue
    description: Write changes to an issue, including its status or owner.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused
    response:
      error: irrelevant_tool
    required: false
  checks:
  - path: /decision/match_count
    equals: 2
  - path: /decision/issue_ids
    equals:
    - OPS-404
    - OPS-405
  consistency_paths:
  - /decision
  forbidden_tools:
  - update_issue
  - delete_issue
  - update_project
  expected_tool_sequence:
  - server: work
    tool: search_issues
- id: project-permission
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Read project PRJ-28 and report its health if accessible. Otherwise report
    false for accessible, null health, and the returned error code. Return the standard
    envelope and the supplied decision schema. Execution protocol: obtain external
    facts by actually calling the MCP bridge before producing the final envelope.
    During evidence collection emit a tool call, not a pretend result or final answer.
    Use the inventory schemas. Read linked records only after obtaining their IDs
    from earlier results. Once sufficient evidence is returned, populate the supplied
    decision schema with those facts, preserving JSON nulls and exact field types.
    Empty lists and explicit access-denial results are final evidence, not invitations
    to invent records. Use authoritative current records rather than unrelated historical
    searches. Copy record field values as returned and preserve search-result order.'
  decision_schema:
    type: object
    required:
    - accessible
    - health
    - reason
    properties:
      accessible:
        type: boolean
      health:
        type:
        - string
        - 'null'
      reason:
        type:
        - string
        - 'null'
  tools:
  - server: portfolio
    name: get_project
    description: Read current project fields by project identifier.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: PRJ-28
    response:
      error: permission_denied
      message: Project access is restricted.
    required: true
    is_error: true
  - server: archive
    name: search_docs
    description: Search historical documents, not current issue or project records.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: unused
    response:
      error: irrelevant_tool
    required: false
  - server: tracker
    name: list_comments
    description: List old issue discussion comments, not current fields.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused
    response:
      error: irrelevant_tool
    required: false
  - server: tracker
    name: update_issue
    description: Write changes to an issue, including its status or owner.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused
    response:
      error: irrelevant_tool
    required: false
  checks:
  - path: /decision/accessible
    equals: false
  - path: /decision/health
    equals: null
  - path: /decision/reason
    equals: permission_denied
  consistency_paths:
  - /decision
  forbidden_tools:
  - update_issue
  - delete_issue
  - update_project
  expected_tool_sequence:
  - server: portfolio
    tool: get_project
