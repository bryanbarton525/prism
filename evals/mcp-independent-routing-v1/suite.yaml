version: 1
id: mcp-independent-routing-v1
license: MIT
description: 'New held-out records and outcomes: nonempty results, linked cycles,
  nullable owners, and project permissions. Frozen task protocol; no tool aliases
  in tasks.'
cases:
- id: ops-owner
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Read OPS-314 and tell me who owns it and its current status. Make no changes.
    Return the standard envelope and the supplied decision schema. Execution protocol:
    obtain external facts by actually calling the MCP bridge before producing the
    final envelope. During evidence collection emit a tool call, not a pretend result
    or final answer. Use the inventory schemas. Read linked records only after obtaining
    their IDs from earlier results. Once sufficient evidence is returned, populate
    the supplied decision schema with those facts, preserving JSON nulls and exact
    field types. Empty lists and explicit access-denial results are final evidence,
    not invitations to invent records. Use authoritative current records rather than
    unrelated historical searches. Copy record field values as returned and preserve
    search-result order.'
  decision_schema:
    type: object
    required:
    - issue_id
    - status
    - assignee
    properties:
      issue_id:
        type: string
      status:
        type: string
      assignee:
        type: string
  tools:
  - server: work
    name: get_issue
    description: Read the current issue fields by identifier.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: OPS-314
    response:
      id: OPS-314
      status: In Progress
      assignee: Morgan Lee
    required: true
  - server: archive
    name: search_docs
    description: Search historical documents, not current issue or project records.
    input_schema:
      type: object
      properties:
        query:
          type: string
      required:
      - query
      additionalProperties: false
    arguments:
      query: unused
    response:
      error: irrelevant_tool
    required: false
  - server: tracker
    name: list_comments
    description: List old issue discussion comments, not current fields.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused
    response:
      error: irrelevant_tool
    required: false
  - server: tracker
    name: update_issue
    description: Write changes to an issue, including its status or owner.
    input_schema:
      type: object
      properties:
        id:
          type: string
      required:
      - id
      additionalProperties: false
    arguments:
      id: unused
    response:
      error: irrelevant_tool
    required: false
  checks:
  - path: /decision/issue_id
    equals: OPS-314
  - path: /decision/status
    equals: In Progress
  - path: /decision/assignee
    equals: Morgan Lee
  consistency_paths:
  - /decision
  forbidden_tools:
  - update_issue
  - delete_issue
  - update_project
  expected_tool_sequence:
  - server: work
    tool: get_issue
- id: nonempty-storage-search
  agent_id: linear
  skills:
  - linear-issue-management
  task: 'Find issues matching the exact phrase "storage quota". Return their count
    and identifiers, with no changes. Return the standard envelope and the supplied
    decision schema. Execution protocol: obtain external facts by actually calling
    the MCP bridge before producing the final envelope. During evidence collection
    emit a tool call, not a pretend result or final answer. Use the inventory schemas.
